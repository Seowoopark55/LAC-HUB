<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0d11" />
    <link rel="icon" type="image/png" href="/hub/mark.png" />
    <style>
      html.lac-build-route #app, html.lac-cook-route #app, #lac-build-host[hidden], #lac-cook-host[hidden] { display: none !important; }
      html.lac-build-route body::before,html.lac-build-route body::after,html.lac-cook-route body::before,html.lac-cook-route body::after { display: none !important; }
      #lac-build-host { display: block; min-height: 100vh; position: relative; z-index: 3; }
      #lac-cook-host { display: block; min-height: 100vh; position: relative; z-index: 3; }
      #lac-cook-host iframe { width:100%;min-height:100vh;border:0;display:block;background:#090b0e; }
      html,body,#app{min-height:100%;margin:0;color:#f1f4f7}html{background:#040608}body{background:#040608}#app{background:transparent}
      .pwa-boot{min-height:100vh;display:grid;place-items:center;font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif}
      .pwa-boot__mark{display:grid;justify-items:center;gap:10px;color:#f1f4f7}
      .pwa-boot__icon{width:48px;height:48px;border:1px solid #27313c;border-radius:12px;background:#0f141a;display:grid;place-items:center;color:#e4b24b;font-weight:950;font-size:21px;letter-spacing:-.04em}
      .pwa-boot__copy{display:grid;justify-items:center;gap:2px}.pwa-boot__copy strong{font-size:13px;letter-spacing:.045em}.pwa-boot__copy small{color:#687481;font-size:8px;font-weight:800;letter-spacing:.15em}
    </style>
    <title>LAC HUB</title>
    <meta name="application-name" content="LAC HUB" />
    <meta name="description" content="LAC HUB · LAC 회사 운영과 편의 기능을 한곳에서" />
  </head>
  <body>
    <div id="app"><section class="pwa-boot" aria-label="LAC HUB 시작 중"><div class="pwa-boot__mark"><div class="pwa-boot__icon">L</div><div class="pwa-boot__copy"><strong>LAC HUB</strong><small>통합 플랫폼</small></div></div></section></div>
    <script>if (/^\/build(?:\/|$)/.test(location.pathname)) document.documentElement.classList.add('lac-build-route'); else if (/^\/cook(?:\/|$)/.test(location.pathname)) document.documentElement.classList.add('lac-cook-route');</script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
